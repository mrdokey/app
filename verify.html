<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>AMS Pro - Verifikasi Klien</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #f4f6f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .container {
      max-width: 480px;
      margin: 0 auto;
      background: #ffffff;
      min-height: 100vh;
      box-sizing: border-box;
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    
    /* STYLE CARD STATUS */
    .status-card {
      border-radius: 16px;
      padding: 24px;
      text-align: center;
      margin-top: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }
    
    /* GAYA JIKA AMAN (HIJAU) */
    .status-safe {
      background-color: #ebfbee;
      border: 2px solid #2ecc71;
      color: #27ae60;
    }
    
    /* GAYA JIKA BLACKLIST (MERAH) */
    .status-warning {
      background-color: #fdf2f2;
      border: 2px solid #e74c3c;
      color: #c0392b;
    }
    
    .status-icon {
      font-size: 56px;
      margin-bottom: 12px;
    }
    .status-title {
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 8px;
    }
    .status-desc {
      font-size: 14px;
      color: #7f8c8d;
      line-height: 1.5;
    }
    
    /* PANEL DETAIL PELAKU */
    .detail-panel {
      margin-top: 20px;
      background: #f8fafc;
      border: 1px solid #edf2f7;
      padding: 16px;
      border-radius: 12px;
      text-align: left;
    }
    .detail-item {
      margin-bottom: 8px;
      font-size: 13px;
    }
    .detail-label {
      font-weight: bold;
      color: #718096;
      font-size: 11px;
      text-transform: uppercase;
    }
    .detail-value {
      font-weight: bold;
      color: #2d3748;
      font-size: 14px;
    }
    
    .ktp-preview {
      width: 100%;
      border-radius: 8px;
      margin-top: 10px;
      border: 1px solid #edf2f7;
      display: none;
    }
    
    /* LOADING SCREEN */
    #loading {
      text-align: center;
      margin-top: 100px;
    }
    .spinner {
      border: 4px solid #f3f3f3;
      border-top: 4px solid #3498db;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      animation: spin 1s linear infinite;
      margin: 0 auto 15px auto;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    .btn-close {
      width: 100%;
      padding: 14px;
      background-color: #2c3e50;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      box-sizing: border-box;
    }
    .footer {
      font-size: 10px;
      color: #95a5a6;
      text-align: center;
      margin-top: 30px;
      border-top: 1px dashed #edf2f7;
      padding-top: 10px;
    }
  </style>
</head>
<body>

  <div class="container">
    <div>
      <!-- Loading Screen -->
      <div id="loading">
        <div class="spinner"></div>
        <div style="color: #7f8c8d; font-size: 14px;">Memeriksa Database Blacklist Terpusat...</div>
      </div>

      <!-- Tampilan Hasil Verifikasi -->
      <div id="resultCard" style="display: none;">
        <!-- Card status akan disisipkan di sini lewat JS -->
      </div>
    </div>

    <div>
      <!-- Tombol Kembali ke AppSheet -->
      <button class="btn-close" onclick="window.history.back()">Kembali ke AppSheet</button>
      <div class="footer">
        AMS Pro Master Verification System<br>
        Powered by <strong>MRD Digital Solution</strong>
      </div>
    </div>
  </div>

  <script>
    // Ambil parameter NIK dari URL
    const urlParams = new URLSearchParams(window.location.search);
    const nik = urlParams.get('nik');
    
    // URL API VPS Anda pada Port 3002
    const vpsApiUrl = "http://103.31.38.30:3002/api/blacklist/" + nik;

    // Helper untuk mengubah link Google Drive biasa agar bisa dirender sebagai Gambar
    function getDirectDriveImgUrl(url) {
      if (url && url.includes("drive.google.com")) {
        try {
          var fileId = url.split("/d/")[1].split("/")[0];
          return "https://drive.google.com/uc?export=view&id=" + fileId;
        } catch (e) {
          return url;
        }
      }
      return url;
    }

    if (!nik) {
      document.getElementById("loading").innerHTML = "<div style='color:#e74c3c; padding:20px;'>Error: Parameter NIK tidak valid.</div>";
    } else {
      // Jalankan fetch cepat ke VPS
      fetch(vpsApiUrl)
        .then(response => response.json())
        .then(result => {
          document.getElementById("loading").style.display = "none";
          var card = document.getElementById("resultCard");
          card.style.display = "block";

          if (result.success) {
            if (result.isBlacklisted) {
              // TAMPILAN JIKA TERKENA BLACKLIST (MERAH)
              var data = result.data;
              var imgUrl = getDirectDriveImgUrl(data.foto_url);
              
              card.innerHTML = `
                <div class="status-card status-warning">
                  <div class="status-icon">🚨</div>
                  <div class="status-title">DITOLAK / BLACKLIST</div>
                  <div class="status-desc">NIK KTP ini terdaftar dalam database daftar hitam sindikat!</div>
                </div>
                
                <div class="detail-panel">
                  <div class="detail-item">
                    <div class="detail-label">Nama Pelaku</div>
                    <div class="detail-value">${data.nama}</div>
                  </div>
                  <div class="detail-item">
                    <div class="detail-label">Nomor NIK</div>
                    <div class="detail-value">${data.nik}</div>
                  </div>
                  <div class="detail-item">
                    <div class="detail-label">Detail Kasus</div>
                    <div class="detail-value" style="color: #c0392b; font-weight: normal;">${data.alasan}</div>
                  </div>
                  <div class="detail-item">
                    <div class="detail-label">Pelapor</div>
                    <div class="detail-value" style="font-size:12px; color:#7f8c8d;">${data.created_by}</div>
                  </div>
                  <div class="detail-item">
                    <div class="detail-label">Foto KTP Pelaku</div>
                    <img src="${imgUrl}" class="ktp-preview" style="display:block;" alt="KTP Blacklist">
                  </div>
                </div>
              `;
            } else {
              // TAMPILAN JIKA AMAN (HIJAU)
              card.innerHTML = `
                <div class="status-card status-safe" style="margin-top: 50px;">
                  <div class="status-icon">✓</div>
                  <div class="status-title">AMAN / VALID</div>
                  <div class="status-desc">NIK ini bersih. Tidak terdaftar dalam database blacklist terpusat kami.</div>
                </div>
                <div style="text-align: center; margin-top: 30px; font-size: 14px; color: #7f8c8d;">
                  Anda dipersilakan melanjutkan proses sewa kendaraan dengan aman.
                </div>
              `;
            }
          } else {
            card.innerHTML = "<div style='color:#e74c3c; text-align:center;'>Gagal mengambil data dari server database VPS.</div>";
          }
        })
        .catch(error => {
          console.error("Error:", error);
          document.getElementById("loading").style.display = "none";
          var card = document.getElementById("resultCard");
          card.style.display = "block";
          card.innerHTML = "<div style='color:#e74c3c; text-align:center; padding: 20px;'><b>Koneksi Terputus:</b> Gagal menghubungi database VPS pada Port 3002.</div>";
        });
    }
  </script>
</body>
</html>
