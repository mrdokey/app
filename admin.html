<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AMS RIDE | Master Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    
    <style>
        body { font-family: 'Public Sans', sans-serif; background-color: #f5f5f9; color: #697a8d; margin: 0; }
        .content-area { padding: 15px; max-width: 100%; }
        
        /* Dashboard Card Style */
        .card { border: none; border-radius: 12px; box-shadow: 0 2px 6px 0 rgba(67, 89, 113, 0.12); background: #fff; height: 100%; }
        .card-stat { border-left: 5px solid #696cff; }
        .card-stat.st-tersedia { border-left-color: #71dd37; } /* Green */
        .card-stat.st-disewa { border-left-color: #696cff; }   /* Blue */
        .card-stat.st-waiting { border-left-color: #ffab00; }  /* Orange */
        .card-stat.st-armada { border-left-color: #8592a3; }  /* Grey */
        
        .stat-label { font-size: 0.7rem; color: #a1acb8; font-weight: 700; text-transform: uppercase; }
        .stat-number { font-size: 1.8rem; font-weight: 800; color: #566a7f; line-height: 1; margin-top: 5px; }
        
        .card-income { background: #696cff; color: white; border: none; }
        .btn-primary { background-color: #696cff; border-color: #696cff; font-weight: 700; }
        
        #loading-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.9); display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 9999; }
        .badge-date { background: #e1f0ff; color: #03c3ec; padding: 4px 8px; border-radius: 4px; font-weight: 700; font-size: 0.7rem; }
    </style>
</head>
<body>

    <div id="loading-overlay">
        <div class="spinner-border text-primary mb-3"></div>
        <p class="fw-bold">SINKRONISASI DATA...</p>
    </div>

    <div id="dashboard-content" class="content-area">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h5 class="fw-bold mb-0">AMS RIDE / DASHBOARD</h5>
            <button class="btn btn-outline-danger btn-sm rounded-pill fw-bold" onclick="logout()">LOG OUT</button>
        </div>

        <div class="row g-2 mb-3">
            <div class="col-6">
                <div class="card p-3 card-stat st-tersedia">
                    <div class="stat-label">Unit Tersedia</div>
                    <div class="stat-number" id="val-tersedia">0</div>
                </div>
            </div>
            <div class="col-6">
                <div class="card p-3 card-stat st-disewa">
                    <div class="stat-label">Sedang Disewa</div>
                    <div class="stat-number" id="val-disewa">0</div>
                </div>
            </div>
            <div class="col-6">
                <div class="card p-3 card-stat st-waiting">
                    <div class="stat-label">Waiting List</div>
                    <div class="stat-number" id="val-waiting">0</div>
                </div>
            </div>
            <div class="col-6">
                <div class="card p-3 card-stat st-armada">
                    <div class="stat-label">Total Armada</div>
                    <div class="stat-number" id="val-armada">0</div>
                </div>
            </div>
        </div>

        <div class="card p-3 card-income mb-3 shadow">
            <div class="d-flex justify-content-between align-items-center">
                <div>
                    <small class="fw-bold opacity-75">ESTIMASI INCOME BULAN INI</small>
                    <div class="h3 fw-bold mb-0" id="val-income">Rp 0</div>
                </div>
                <i class="fas fa-wallet fa-2x opacity-50"></i>
            </div>
        </div>

        <button class="btn btn-primary w-100 py-3 mb-4 shadow rounded-3" data-bs-toggle="modal" data-bs-target="#modalReg">
            <i class="fas fa-plus-circle me-2"></i> REGISTER RENTAL BARU
        </button>

        <div class="card">
            <div class="card-header bg-transparent border-bottom py-3">
                <h6 class="mb-0 fw-bold"><i class="fas fa-history text-primary me-2"></i>Recent History</h6>
            </div>
            <div class="table-responsive">
                <table class="table table-hover mb-0" style="font-size: 0.85rem;">
                    <thead>
                        <tr>
                            <th>TGL</th>
                            <th>UNIT</th>
                            <th>PENYEWA</th>
                            <th>TOTAL</th>
                        </tr>
                    </thead>
                    <tbody id="table-history"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="modal fade" id="modalReg" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered p-3">
            <div class="modal-content rounded-4 border-0">
                <div class="modal-body p-4">
                    <h5 class="fw-bold mb-4">Input Register Baru</h5>
                    <form id="formInput">
                        <div class="mb-3">
                            <label class="form-label small fw-bold">PILIH MOTOR</label>
                            <select id="sel-motor" class="form-select" required></select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-bold">NAMA PENYEWA</label>
                            <input list="cust-list" id="inp-nama" class="form-control" required>
                            <datalist id="cust-list"></datalist>
                        </div>
                        <div class="row g-2 mb-4">
                            <div class="col-6">
                                <label class="form-label small fw-bold">DURASI (HARI)</label>
                                <input type="number" id="inp-durasi" class="form-control" required>
                            </div>
                            <div class="col-6">
                                <label class="form-label small fw-bold">TOTAL HARGA</label>
                                <input type="number" id="inp-total" class="form-control" required>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 py-2">SIMPAN DATA</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script>
        const webAppUrl = "https://script.google.com/macros/s/AKfycbxcXYNKgxMYEtQKMyFrcPvvF0sHHn3I3GBZa6lkFhPhhTV-2rYUeS8C4Lgc4BojVETDtQ/exec";
        
        function loadData() {
            document.getElementById('loading-overlay').style.display = 'flex';
            fetch(`${webAppUrl}?action=read_full`)
            .then(res => res.json())
            .then(data => {
                // LOGIKA SINKRONISASI (DIAMBIL DARI DATA.JSON HASIL GOOGLE SCRIPT)
                document.getElementById('val-tersedia').innerText = data.unitsAvailable; // Dari Item status Available
                document.getElementById('val-disewa').innerText = data.unitsRented;       // Dari Item status Rent
                document.getElementById('val-waiting').innerText = data.unitsBooked;      // Dari Register status Booked
                document.getElementById('val-armada').innerText = data.totalArmada;       // Total Baris Item
                document.getElementById('val-income').innerText = "Rp " + data.income;

                // Update Table History
                let rows = "";
                data.records.forEach(r => {
                    rows += `<tr>
                        <td><span class="badge-date">${r.tgl}</span></td>
                        <td class="fw-bold">${r.unit}</td>
                        <td>${r.nama}</td>
                        <td class="text-primary fw-bold">${r.total}</td>
                    </tr>`;
                });
                document.getElementById('table-history').innerHTML = rows;

                // Update Motor Select (Hanya yang Available)
                let opt = '<option value="">-- Pilih Unit --</option>';
                data.motors.filter(m => m.status === "Available").forEach(m => {
                    opt += `<option value="${m.no_motor}">${m.no_motor} - ${m.tipe}</option>`;
                });
                document.getElementById('sel-motor').innerHTML = opt;

                document.getElementById('loading-overlay').style.display = 'none';
            });
        }

        // Jalankan load data saat halaman siap
        window.onload = loadData;
        
        function logout() { localStorage.clear(); location.reload(); }
    </script>
</body>
</html>
