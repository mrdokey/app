<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AMS RIDE | Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Public Sans', sans-serif; background-color: #f5f5f9; margin: 0; padding: 15px; }
        .card { border: none; border-radius: 12px; box-shadow: 0 2px 6px rgba(67, 89, 113, 0.12); margin-bottom: 12px; }
        
        /* Stats Styling sesuai Arta */
        .st-box { padding: 15px; border-left: 5px solid; }
        .st-available { border-left-color: #71dd37; color: #71dd37; } /* Hijau */
        .st-rent { border-left-color: #696cff; color: #696cff; }      /* Biru */
        .st-booked { border-left-color: #ffab00; color: #ffab00; }    /* Oranye */
        .st-total { border-left-color: #8592a3; color: #8592a3; }     /* Abu-abu */
        
        .st-label { font-size: 0.65rem; font-weight: 700; text-transform: uppercase; color: #a1acb8; }
        .st-val { font-size: 1.8rem; font-weight: 800; color: #566a7f; }
        
        .card-income { background: linear-gradient(72deg, #696cff 0%, #3f42ef 100%); color: white; }
        .btn-reg { background: #696cff; color: white; font-weight: 700; border-radius: 8px; border: none; width: 100%; padding: 15px; }
        
        #overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.9); 
                   display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 9999; }
        .table-history { font-size: 0.8rem; }
    </style>
</head>
<body>

    <div id="overlay">
        <div class="spinner-border text-primary mb-2"></div>
        <div class="fw-bold text-primary">SINKRONISASI DATA...</div>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h5 class="fw-bold mb-0">AMS RIDE / <span class="text-muted">DASHBOARD</span></h5>
        <button class="btn btn-sm btn-outline-danger" onclick="location.reload()">REFRESH</button>
    </div>

    <div class="row g-2 mb-3">
        <div class="col-6">
            <div class="card st-box st-available">
                <div class="st-label">Unit Tersedia</div>
                <div class="st-val" id="val-available">0</div>
            </div>
        </div>
        <div class="col-6">
            <div class="card st-box st-rent">
                <div class="st-label">Sedang Disewa</div>
                <div class="st-val" id="val-rent">0</div>
            </div>
        </div>
        <div class="col-6">
            <div class="card st-box st-booked">
                <div class="st-label">Waiting List</div>
                <div class="st-val" id="val-booked">0</div>
            </div>
        </div>
        <div class="col-6">
            <div class="card st-box st-total">
                <div class="st-label">Total Armada</div>
                <div class="st-val" id="val-total">0</div>
            </div>
        </div>
    </div>

    <div class="card card-income p-3 mb-3">
        <small class="fw-bold opacity-75">ESTIMASI INCOME BULAN INI</small>
        <div class="h2 fw-bold mb-0" id="val-income">Rp 0</div>
    </div>

    <button class="btn-reg shadow-sm mb-4" data-bs-toggle="modal" data-bs-target="#modalReg">
        <i class="fas fa-plus-circle me-2"></i> REGISTER RENTAL BARU
    </button>

    <div class="card">
        <div class="card-header bg-transparent py-3 fw-bold border-bottom">
            <i class="fas fa-history me-2 text-primary"></i>Recent History
        </div>
        <div class="table-responsive">
            <table class="table table-hover mb-0 table-history">
                <thead>
                    <tr>
                        <th>TGL</th>
                        <th>UNIT</th>
                        <th>PENYEWA</th>
                        <th>TOTAL</th>
                    </tr>
                </thead>
                <tbody id="table-body"></tbody>
            </table>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // GANTI INI DENGAN URL WEB APP MASTER
        const URL_APP = "https://script.google.com/macros/s/AKfycbxcXYNKgxMYEtQKMyFrcPvvF0sHHn3I3GBZa6lkFhPhhTV-2rYUeS8C4Lgc4BojVETDtQ/exec";

        function fetchData() {
            document.getElementById('overlay').style.display = 'flex';
            
            fetch(`${URL_APP}?action=read_full`)
            .then(res => res.json())
            .then(data => {
                // SINKRONISASI LOGIKA ARTA
                // Pastikan di Google Script Master mengirim field: unitsAvailable, unitsRented, unitsBooked, totalArmada
                document.getElementById('val-available').innerText = data.unitsAvailable || 0;
                document.getElementById('val-rent').innerText = data.unitsRented || 0;
                document.getElementById('val-booked').innerText = data.unitsBooked || 0;
                document.getElementById('val-total').innerText = data.totalArmada || 0;
                document.getElementById('val-income').innerText = "Rp " + (data.income || 0);

                let rows = "";
                data.records.forEach(r => {
                    rows += `<tr>
                        <td><span class="badge bg-label-info">${r.tgl}</span></td>
                        <td class="fw-bold">${r.unit}</td>
                        <td>${r.nama}</td>
                        <td class="text-primary fw-bold">${r.total}</td>
                    </tr>`;
                });
                document.getElementById('table-body').innerHTML = rows;
                
                document.getElementById('overlay').style.display = 'none';
            })
            .catch(err => {
                console.error(err);
                alert("Gagal ambil data. Cek koneksi atau Script Master!");
                document.getElementById('overlay').style.display = 'none';
            });
        }

        window.onload = fetchData;
    </script>
</body>
</html>
