<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMS Command Center | MRD Digital Solution</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    
    <style>
        :root { --primary: #0d6efd; --dark: #0f1113; --card: #1a1d21; }
        body { background-color: var(--dark); color: white; font-family: 'Plus Jakarta Sans', sans-serif; }
        #dashboard-content { display: none; padding: 30px; }
        .stat-card { background: var(--card); border: 1px solid #2d3238; border-radius: 20px; padding: 25px; transition: 0.3s; }
        .table-container { background: var(--card); border-radius: 20px; padding: 20px; border: 1px solid #2d3238; margin-top: 30px; }
        .table { color: white; border-color: #2d3238; }
        .modal-content { background: var(--card); border: 1px solid var(--primary); color: white; border-radius: 25px; }
        .form-control { background: #25292e; border: 1px solid #3d4349; color: white; }
        #loading-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15,17,19,0.9); display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 9999; }
    </style>
</head>
<body>

    <div id="loading-overlay">
        <div class="spinner-border text-primary mb-3"></div>
        <p class="fw-bold">Sedang Memproses Data...</p>
    </div>

    <div id="login-page" class="text-center" style="height:100vh; display:flex; flex-direction:column; justify-content:center; align-items:center;">
        <i class="fas fa-microchip fa-4x text-primary mb-3"></i>
        <h2 class="fw-bold">MRD <span class="text-primary">DIGITAL</span></h2>
        <p class="text-secondary mb-4">AMS - Management & Monitoring System</p>
        <div id="buttonDiv"></div>
    </div>

    <div id="dashboard-content">
        <div class="d-flex justify-content-between align-items-center mb-5">
            <div>
                <h4 class="fw-bold mb-0 text-uppercase">AMS <span class="text-primary">Command Center</span></h4>
                <small class="text-secondary" id="client-info">Memuat sesi...</small>
            </div>
            <button class="btn btn-outline-danger btn-sm rounded-pill px-4" onclick="location.reload()">Logout</button>
        </div>

        <div class="row g-4 mb-5">
            <div class="col-md-4"><div class="stat-card"><small class="text-secondary">ESTIMASI INCOME</small><h2 class="fw-bold text-success" id="stat-income">Rp 0</h2></div></div>
            <div class="col-md-4"><div class="stat-card"><small class="text-secondary">UNIT AKTIF</small><h2 class="fw-bold" id="stat-units">0 Unit</h2></div></div>
            <div class="col-md-4"><div class="stat-card"><small class="text-secondary">BOOKING BARU</small><h2 class="fw-bold text-warning" id="stat-booking">0</h2></div></div>
        </div>

        <div class="d-flex justify-content-between align-items-center">
            <h5 class="fw-bold">Monitoring Rental</h5>
            <button class="btn btn-primary rounded-pill px-4" data-bs-toggle="modal" data-bs-target="#modalInput">
                <i class="fas fa-plus me-2"></i> Input Register
            </button>
        </div>

        <div class="table-container shadow-lg">
            <div class="table-responsive">
                <table class="table">
                    <thead><tr><th>Tgl</th><th>Customer</th><th>Unit</th><th>Durasi</th><th>Total</th></tr></thead>
                    <tbody id="table-body"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="modal fade" id="modalInput" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content p-4">
                <h5 class="fw-bold mb-4">Register Rental Baru</h5>
                <form id="formRegister">
                    <input type="text" class="form-control mb-3" id="customer_name" placeholder="Nama Pelanggan" required>
                    <div class="row">
                        <div class="col"><input type="text" class="form-control mb-3" id="unit_name" placeholder="Unit (Vario/NMAX)" required></div>
                        <div class="col"><input type="number" class="form-control mb-3" id="duration" placeholder="Hari" required></div>
                    </div>
                    <input type="number" class="form-control mb-4" id="total_price" placeholder="Total Bayar (Rp)" required>
                    <button type="submit" class="btn btn-primary w-100 py-3 rounded-pill fw-bold">SIMPAN DATA</button>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const webAppUrl = "https://script.google.com/macros/s/AKfycbx2QXUgFhRSPiyQtMy5WKNtXaOy8tdGYgVGkYXUAAoBpcf4siB40rFVONfg1CBZEz2FUA/exec";
        let userEmail = "";

        function handleCredentialResponse(response) {
            const payload = JSON.parse(atob(response.credential.split('.')[1]));
            userEmail = payload.email;
            document.getElementById('login-page').style.display = 'none';
            document.getElementById('dashboard-content').style.display = 'block';
            document.getElementById('client-info').innerText = "Logged in as: " + userEmail;
            loadData();
        }

        function loadData() {
            document.getElementById('loading-overlay').style.display = 'flex';
            fetch(`${webAppUrl}?action=read&email=${userEmail}`)
                .then(r => r.json())
                .then(data => {
                    document.getElementById('stat-income').innerText = "Rp " + data.income;
                    document.getElementById('stat-units').innerText = data.units + " Unit";
                    document.getElementById('stat-booking').innerText = data.booking;
                    let html = "";
                    data.records.forEach(r => {
                        html += `<tr><td>${r.tgl}</td><td>${r.nama}</td><td>${r.unit}</td><td>${r.durasi}d</td><td>Rp ${r.total}</td></tr>`;
                    });
                    document.getElementById('table-body').innerHTML = html;
                    document.getElementById('loading-overlay').style.display = 'none';
                }).catch(err => {
                    document.getElementById('loading-overlay').style.display = 'none';
                    alert("Akses Ditolak: Email tidak terdaftar di MRD Master.");
                });
        }

        document.getElementById('formRegister').onsubmit = function(e) {
            e.preventDefault();
            document.getElementById('loading-overlay').style.display = 'flex';
            const body = {
                action: "insert", email: userEmail,
                nama: document.getElementById('customer_name').value,
                unit: document.getElementById('unit_name').value,
                durasi: document.getElementById('duration').value,
                total: document.getElementById('total_price').value
            };
            fetch(webAppUrl, { method: "POST", body: JSON.stringify(body) })
                .then(() => { 
                    bootstrap.Modal.getInstance(document.getElementById('modalInput')).hide();
                    document.getElementById('formRegister').reset();
                    loadData(); 
                });
        };

        window.onload = function () {
            google.accounts.id.initialize({
                client_id: "212161035085-1e9tq8phf1tmski9hnvhd0v17b6tkp9o.apps.googleusercontent.com",
                callback: handleCredentialResponse
            });
            google.accounts.id.renderButton(document.getElementById("buttonDiv"), { theme: "outline", size: "large" });
        };
    </script>
</body>
</html>
