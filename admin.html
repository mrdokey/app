<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMS RIDE | MRD Digital</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        :root { --primary: #0d6efd; --dark: #0f1113; --card: #1a1d21; }
        body { background-color: var(--dark); color: white; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        #dashboard-content { display: none; padding: 20px; }
        .stat-card { background: var(--card); border: 1px solid #2d3238; border-radius: 15px; padding: 15px; text-align: center; }
        .table-container { background: var(--card); border-radius: 15px; padding: 15px; margin-top: 20px; border: 1px solid #2d3238; }
        .table { color: #e0e0e0; }
        #loading-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 9999; }
        /* Light Form Styling */
        .modal-content { background: #ffffff; color: #333; border-radius: 20px; border: none; }
        .form-label { font-weight: bold; font-size: 0.8rem; color: #666; margin-bottom: 3px; }
        .form-control, .form-select { background: #f1f3f5; border: 1px solid #dee2e6; color: #333; }
        .form-control:focus, .form-select:focus { background: #fff; color: #333; border-color: var(--primary); box-shadow: none; }
    </style>
</head>
<body>
    <div id="loading-overlay"><div class="spinner-grow text-primary mb-2"></div><p class="fw-bold">Syncing AMS RIDE Data...</p></div>

    <div id="login-page" style="height:100vh; display:flex; flex-direction:column; justify-content:center; align-items:center;">
        <h1 class="fw-bold">AMS <span class="text-primary">RIDE</span></h1>
        <p class="text-secondary small">Powered by MRD Digital Solution</p>
        <div id="buttonDiv" class="mt-3"></div>
    </div>

    <div id="dashboard-content">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h5 class="fw-bold mb-0">COMMAND <span class="text-primary">CENTER</span></h5>
            <button class="btn btn-outline-danger btn-sm rounded-pill px-3" onclick="location.reload()">Logout</button>
        </div>

        <div class="row g-3 mb-4">
            <div class="col-6"><div class="stat-card"><small class="text-secondary">INCOME</small><h4 class="fw-bold mb-0" id="stat-income">0</h4></div></div>
            <div class="col-6"><div class="stat-card"><small class="text-secondary">READY UNIT</small><h4 class="fw-bold mb-0" id="stat-units">0</h4></div></div>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-3">
            <h6 class="fw-bold mb-0 text-primary">Recent Register</h6>
            <button class="btn btn-primary btn-sm rounded-pill px-4 shadow" data-bs-toggle="modal" data-bs-target="#modalInput"><i class="fas fa-plus me-1"></i> Baru</button>
        </div>

        <div class="table-container shadow-lg">
            <div class="table-responsive"><table class="table table-dark table-hover small mb-0">
                <thead><tr><th>Tgl</th><th>Unit</th><th>Nama</th><th>Total</th></tr></thead>
                <tbody id="table-body"></tbody>
            </table></div>
        </div>
    </div>

    <div class="modal fade" id="modalInput" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content shadow">
                <div class="modal-body p-4">
                    <h5 class="fw-bold text-primary mb-3">Register Rental</h5>
                    <form id="formRegister">
                        <label class="form-label">Pilih Armada (Plat)</label>
                        <select class="form-select mb-2" id="motor_id" required><option value="">-- Pilih --</option></select>
                        
                        <label class="form-label">Data Penyewa</label>
                        <input list="listCustomer" class="form-control mb-2" id="customer_id" placeholder="Nama Lengkap" required>
                        <datalist id="listCustomer"></datalist>
                        
                        <input type="tel" class="form-control mb-2" id="wa_number" placeholder="No WhatsApp (08xxx)" required>
                        
                        <label class="form-label">Alamat Antar & Jemput</label>
                        <textarea class="form-control mb-2" id="addr_antar" rows="2" placeholder="Lokasi Antar"></textarea>
                        <textarea class="form-control mb-2" id="addr_jemput" rows="2" placeholder="Lokasi Jemput"></textarea>
                        
                        <div class="row g-2 mb-3">
                            <div class="col-6"><label class="form-label">Hari</label><input type="number" class="form-control" id="duration" placeholder="Jml Hari" required></div>
                            <div class="col-6"><label class="form-label">Total Rp</label><input type="number" class="form-control" id="total_price" placeholder="Harga" required></div>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 fw-bold py-2 shadow-sm">SIMPAN KE DATABASE</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const webAppUrl = "https://script.google.com/macros/s/AKfycbxcXYNKgxMYEtQKMyFrcPvvF0sHHn3I3GBZa6lkFhPhhTV-2rYUeS8C4Lgc4BojVETDtQ/exec";
        let userEmail = "";

        function handleCredentialResponse(response) {
            const payload = JSON.parse(atob(response.credential.split('.')[1]));
            userEmail = payload.email;
            document.getElementById('login-page').style.display = 'none';
            document.getElementById('dashboard-content').style.display = 'block';
            loadData();
        }

        function loadData() {
            document.getElementById('loading-overlay').style.display = 'flex';
            fetch(`${webAppUrl}?action=read_full&email=${userEmail}`).then(r => r.json()).then(data => {
                document.getElementById('stat-income').innerText = "Rp " + data.income;
                document.getElementById('stat-units').innerText = data.unitsReady;
                let h = ""; data.records.forEach(r => { h += `<tr><td>${r.tgl}</td><td>${r.unit}</td><td>${r.nama}</td><td>${r.total}</td></tr>`; });
                document.getElementById('table-body').innerHTML = h;
                let m = '<option value="">-- Pilih --</option>'; data.motors.forEach(i => { m += `<option value="${i.no_motor}">${i.no_motor} (${i.tipe})</option>`; });
                document.getElementById('motor_id').innerHTML = m;
                let c = ""; data.customers.forEach(i => { c += `<option value="${i.nama}">`; });
                document.getElementById('listCustomer').innerHTML = c;
                document.getElementById('loading-overlay').style.display = 'none';
            });
        }

        document.getElementById('formRegister').onsubmit = function(e) {
            e.preventDefault();
            document.getElementById('loading-overlay').style.display = 'flex';
            const body = {
                action: "insert_register", email: userEmail,
                no_motor: document.getElementById('motor_id').value,
                customer: document.getElementById('customer_id').value,
                wa: document.getElementById('wa_number').value,
                addr_antar: document.getElementById('addr_antar').value,
                addr_jemput: document.getElementById('addr_jemput').value,
                durasi: document.getElementById('duration').value,
                total: document.getElementById('total_price').value
            };
            fetch(webAppUrl, { method: "POST", body: JSON.stringify(body) }).then(() => {
                bootstrap.Modal.getInstance(document.getElementById('modalInput')).hide();
                document.getElementById('formRegister').reset();
                loadData();
            });
        };

        window.onload = function () {
            google.accounts.id.initialize({ client_id: "212161035085-1e9tq8phf1tmski9hnvhd0v17b6tkp9o.apps.googleusercontent.com", callback: handleCredentialResponse });
            google.accounts.id.renderButton(document.getElementById("buttonDiv"), { theme: "outline", size: "large" });
        };
    </script>
</body>
</html>
