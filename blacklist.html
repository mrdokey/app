<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>AMS Pro - Input Blacklist Terpusat</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #f4f6f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #2c3e50;
    }
    .container {
      max-width: 480px;
      margin: 0 auto;
      background: #ffffff;
      min-height: 100vh;
      box-sizing: border-box;
      padding: 20px;
      box-shadow: 0 0 10px rgba(0,0,0,0.05);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .header {
      text-align: center;
      margin-bottom: 20px;
    }
    .header h2 {
      margin: 0;
      font-size: 20px;
      color: #2c3e50;
    }
    .header p {
      margin: 5px 0 0 0;
      font-size: 12px;
      color: #7f8c8d;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      font-size: 12px;
      font-weight: bold;
      margin-bottom: 6px;
      color: #34495e;
      text-transform: uppercase;
    }
    input[type="text"], input[type="number"], textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #dcdde1;
      border-radius: 8px;
      font-size: 14px;
      box-sizing: border-box;
      outline: none;
      background-color: #f8f9fa;
      transition: border-color 0.2s;
    }
    input:focus, textarea:focus {
      border-color: #3498db;
      background-color: #ffffff;
    }
    
    /* STYLE UNTUK INPUT KAMERA KTP */
    .camera-area {
      border: 2px dashed #3498db;
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      background-color: #f0f8ff;
      cursor: pointer;
      position: relative;
      margin-bottom: 15px;
    }
    .camera-area input[type="file"] {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      opacity: 0;
      cursor: pointer;
    }
    .camera-icon {
      font-size: 32px;
      margin-bottom: 8px;
    }
    .preview-img {
      width: 100%;
      max-height: 200px;
      object-fit: contain;
      border-radius: 8px;
      display: none;
      margin-top: 10px;
    }
    
    /* STATUS INDIKATOR UPLOAD */
    .upload-status {
      font-size: 12px;
      margin-top: 5px;
      font-weight: bold;
      display: none;
    }
    .status-loading { color: #f39c12; }
    .status-success { color: #2ecc71; }
    .status-error { color: #e74c3c; }

    .btn-submit {
      width: 100%;
      padding: 14px;
      background-color: #2c3e50;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      margin-top: 10px;
    }
    .btn-submit:disabled {
      background-color: #bdc3c7;
      cursor: not-allowed;
    }
    
    .footer {
      font-size: 10px;
      color: #95a5a6;
      text-align: center;
      margin-top: 30px;
      border-top: 1px dashed #edf2f7;
      padding-top: 10px;
    }
    .footer strong {
      color: #3498db;
    }
  </style>
</head>
<body>

  <div class="container">
    <div>
      <div class="header">
        <h2>AMS Pro Blacklist Database</h2>
        <p>Sistem Pengamanan Sindikat Penggelapan Motor & Mobil</p>
      </div>

      <!-- Area Pengambilan Foto KTP -->
      <div class="form-group">
        <label>Foto KTP Pelaku (Wajib)</label>
        <div class="camera-area">
          <div id="cameraPrompt">
            <div class="camera-icon">📸</div>
            <span style="font-size: 13px; font-weight: bold; color: #3498db;">Ambil Foto KTP</span><br>
            <span style="font-size: 11px; color: #7f8c8d;">Klik untuk membuka kamera HP</span>
          </div>
          <!-- Input File khusus memicu kamera pada HP -->
          <input type="file" id="ktpInput" accept="image/*" capture="camera" onchange="processAndUploadKtp(this)">
          <img id="imagePreview" class="preview-img" alt="Pratinjau KTP">
        </div>
        <div id="uploadStatus" class="upload-status"></div>
      </div>

      <!-- Formulir Isian Teks -->
      <form id="blacklistForm" onsubmit="submitBlacklistData(event)">
        <div class="form-group">
          <label>Nomor NIK KTP (16 Digit)</label>
          <input type="number" id="nikInput" required placeholder="Contoh: 5102XXXXXXXXXXXX" oninput="limitNikLength(this)">
        </div>

        <div class="form-group">
          <label>Nama Lengkap Pelaku</label>
          <input type="text" id="nameInput" required placeholder="Sesuai nama KTP">
        </div>

        <div class="form-group">
          <label>Detail Pelanggaran / Kasus</label>
          <textarea id="caseInput" required rows="3" placeholder="Contoh: Melarikan motor Nmax plat DK XXXX, mengganti nomor HP, KTP palsu."></textarea>
        </div>

        <div class="form-group">
          <label>Admin Pelapor (Nama Rental Anda)</label>
          <input type="text" id="adminLabel" placeholder="Contoh: Gandewa Rental" required>
        </div>

        <button type="submit" id="submitBtn" class="gmaps-btn" style="width: 100%; border: none; background-color: #e74c3c;" disabled>
          Simpan Ke Daftar Hitam Terpusat
        </button>
      </form>
    </div>

    <div class="footer">
      AMS Pro Master Registry System<br>
      Sistem Keamanan Terintegrasi <strong>MRD Digital Solution</strong>
    </div>
  </div>

  <script>
    // URL Web App GAS Uploader Anda yang sudah dideploy
    const gasWebUrl = "https://script.google.com/macros/s/AKfycbxdUUlskv5csUSBL9OnECGrgKzhUKdRufFMZu82eSwhOBH5ICu5zyS5k0O3Xd7TS4xGA/exec";
    
    // URL API VPS Anda pada Port 3002
    const vpsApiUrl = "http://103.31.38.30:3002/api/blacklist";

    var uploadedImageUrl = ""; // Menyimpan URL KTP dari Drive

    // Batasi NIK agar tidak lebih dari 16 angka
    function limitNikLength(element) {
      if (element.value.length > 16) {
        element.value = element.value.slice(0, 16);
      }
    }

    // Fungsi kompresi gambar dan upload langsung ke GAS -> Google Drive
    function processAndUploadKtp(input) {
      if (input.files && input.files[0]) {
        var file = input.files[0];
        
        // Tampilkan Loading Status
        var statusDiv = document.getElementById("uploadStatus");
        statusDiv.style.display = "block";
        statusDiv.className = "upload-status status-loading";
        statusDiv.innerText = "⏳ Sedang mengompresi & mengunggah gambar...";
        
        document.getElementById("submitBtn").disabled = true;

        var reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = function (event) {
          var img = new Image();
          img.src = event.target.result;
          img.onload = function () {
            // Melakukan kompresi di sisi browser menggunakan Canvas
            var canvas = document.createElement('canvas');
            var MAX_WIDTH = 1000; // Maksimalkan lebar 1000px saja agar ringan
            var width = img.width;
            var height = img.height;

            if (width > MAX_WIDTH) {
              height *= MAX_WIDTH / width;
              width = MAX_WIDTH;
            }
            canvas.width = width;
            canvas.height = height;

            var ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, width, height);

            // Konversi ke Base64 JPEG dengan kualitas 70% (Sangat hemat ruang & kencang)
            var base64Compressed = canvas.toDataURL("image/jpeg", 0.7);

            // Tampilkan Preview Gambar
            var preview = document.getElementById("imagePreview");
            preview.src = base64Compressed;
            preview.style.display = "block";
            document.getElementById("cameraPrompt").style.display = "none";

            // Jalankan pengunggahan ke GAS Web App
            uploadToGoogleDrive(base64Compressed, file.name);
          };
        };
      }
    }

    // Mengunggah Base64 langsung ke GAS
    function uploadToGoogleDrive(base64Data, originalName) {
      var statusDiv = document.getElementById("uploadStatus");

      var payload = {
        "image": base64Data,
        "filename": "KTP_" + new Date().getTime() + "_" + originalName
      };

      fetch(gasWebUrl, {
        method: "POST",
        body: JSON.stringify(payload)
      })
      .then(response => response.json())
      .then(result => {
        if (result.success) {
          uploadedImageUrl = result.imageUrl; // Kunci URL KTP dari Drive
          statusDiv.className = "upload-status status-success";
          statusDiv.innerText = "✅ Foto KTP sukses terunggah ke Google Drive!";
          document.getElementById("submitBtn").disabled = false; // Aktifkan tombol submit
        } else {
          statusDiv.className = "upload-status status-error";
          statusDiv.innerText = "❌ Gagal mengunggah: " + result.error;
        }
      })
      .catch(error => {
        console.error("Error upload:", error);
        statusDiv.className = "upload-status status-error";
        statusDiv.innerText = "❌ Terjadi gangguan jaringan saat mengunggah foto.";
      });
    }

    // Kirim seluruh formulir data teks ke API VPS
    function submitBlacklistData(event) {
      event.preventDefault();
      
      var nik = document.getElementById("nikInput").value;
      var name = document.getElementById("nameInput").value;
      var caseDetail = document.getElementById("caseInput").value;
      var adminReport = document.getElementById("adminLabel").value;

      if (nik.length !== 16) {
        alert("NIK harus tepat berisi 16 digit angka!");
        return;
      }

      if (!uploadedImageUrl) {
        alert("Foto KTP wajib diunggah terlebih dahulu!");
        return;
      }

      var payload = {
        "nik": nik,
        "nama": name,
        "alasan": caseDetail,
        "foto_url": uploadedImageUrl,
        "created_by": adminReport
      };

      // Tampilkan proses loading di tombol
      var submitBtn = document.getElementById("submitBtn");
      submitBtn.disabled = true;
      submitBtn.innerText = "⏳ Sedang Menyimpan ke VPS...";

      fetch(vpsApiUrl, {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify(payload)
      })
      .then(response => response.json())
      .then(result => {
        submitBtn.disabled = false;
        submitBtn.innerText = "Simpan Ke Daftar Hitam Terpusat";

        if (result.success) {
          alert("SUKSES: " + result.message);
          // Reset Form setelah sukses disimpan
          document.getElementById("blacklistForm").reset();
          document.getElementById("imagePreview").style.display = "none";
          document.getElementById("cameraPrompt").style.display = "block";
          document.getElementById("uploadStatus").style.display = "none";
          uploadedImageUrl = "";
        } else {
          alert("GAGAL: " + result.message);
        }
      })
      .catch(error => {
        submitBtn.disabled = false;
        submitBtn.innerText = "Simpan Ke Daftar Hitam Terpusat";
        console.error("Error VPS Save:", error);
        alert("Gagal terhubung ke database VPS. Pastikan port 3002 aktif.");
      });
    }
  </script>
</body>
</html>
