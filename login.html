<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | MRD Digital Solution</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root { --primary: #696cff; --bg: #f5f5f9; }
        body { 
            background: var(--bg); 
            height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center;
            font-family: 'Public Sans', sans-serif;
        }
        .login-card {
            width: 100%;
            max-width: 450px;
            background: #fff;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        .brand-section { text-align: center; margin-bottom: 30px; }
        .brand-logo { font-size: 2rem; color: var(--primary); font-weight: 800; margin-bottom: 5px; }
        .form-label { font-weight: 600; color: #566a7f; }
        
        /* Modifikasi untuk input pencarian */
        .search-client { 
            padding: 12px; 
            border-radius: 8px; 
            border: 1px solid #d9dee3;
            font-weight: 500;
        }
        .search-client:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 0.25rem rgba(105, 108, 255, 0.1);
        }
        
        /* Styling untuk list autocomplete */
        #autocomplete-list {
            position: absolute;
            z-index: 1000;
            width: 100%;
            max-height: 200px;
            overflow-y: auto;
            display: none;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            border-radius: 8px;
            margin-top: 5px;
        }
        .autocomplete-item {
            cursor: pointer;
            font-weight: 500;
        }
        .autocomplete-item:hover {
            background-color: var(--bg);
            color: var(--primary);
        }

        .btn-enter { 
            background: var(--primary); 
            border: none; 
            padding: 12px; 
            font-weight: 700; 
            transition: 0.3s;
        }
        .btn-enter:hover { transform: translateY(-3px); background: #5f61e6; }
        .footer-text { font-size: 0.8rem; color: #a1acb8; text-align: center; margin-top: 25px; }
    </style>
</head>
<body>

<div class="login-card">
    <div class="brand-section">
        <div class="brand-logo"><i class="fas fa-shield-alt"></i> MRD</div>
        <div class="fw-bold text-dark">Digital Solution - AMS RIDE</div>
    </div>

    <h5 class="fw-bold mb-3">Login Admin</h5>
    <p class="text-muted small mb-4">Ketik nama Client untuk mengakses dashboard management.</p>

    <div class="mb-4 position-relative">
        <label class="form-label">Nama Client / Brand</label>
        <input type="text" id="clientSearch" class="form-control search-client" placeholder="Ketik minimal 2 huruf..." autocomplete="off">
        
        <ul id="autocomplete-list" class="list-group"></ul>
        
        <input type="hidden" id="selectedUrl" value="">
    </div>

    <button onclick="enterSystem()" class="btn btn-primary btn-enter w-100 rounded-3">
        MASUK KE SISTEM <i class="fas fa-arrow-right ms-2"></i>
    </button>

    <div class="footer-text">
        &copy; 2026 MRD Digital Solution. All Rights Reserved.
    </div>
</div>

<script>
    // 1. Pindahkan data client ke dalam Array Object JavaScript
    const clients = [
        { name: "JIMBARAN SCOOTER RENTAL", url: "https://www.appsheet.com/start/92abe587-6993-47cf-af5d-e43a6f69a2ce" },
        { name: "ARTA RENTAL", url: "https://www.appsheet.com/start/e10e9dd9-0fea-4484-8f7a-53ddd2531d0b" },
        { name: "RENTAL MOTOR BALI1", url: "https://www.appsheet.com/start/6b39327d-06ce-43e1-a5bd-d29604582459" },
        { name: "KETUT RENT BIKE", url: "https://www.appsheet.com/start/a4865a18-35c5-4b07-98da-47637cc59859" },
        { name: "HR BIKE RENTAL", url: "https://www.appsheet.com/start/e202fed5-00ae-446f-9433-5c1474b41d4d" },
        { name: "BUDI.BALITOURS | VIP SCOOTER", url: "https://www.appsheet.com/start/835e3ab3-0173-4129-b6ec-b4174ae053f6" },
        { name: "JACKY RENBIKE", url: "https://www.appsheet.com/start/ef399a53-dbe2-472f-97f9-ffa8082ffbbe" },
        { name: "493 SCOOTER RENTALS", url: "https://www.appsheet.com/start/f66478d0-869b-44de-b561-85d8cbca3f94" },
        { name: "ZELLY RENTAL BALI", url: "https://www.appsheet.com/start/55912c65-5992-40f6-8cee-29c10fbc1e91" },
        { name: "GANDEWA RENTAL", url: "https://www.appsheet.com/start/54b01d67-04be-4dec-95f3-b2b92248fe80" },
        { name: "KARBIT BIKE RENTAL", url: "https://www.appsheet.com/start/480afd9c-919e-48d4-9332-56f9a3e66ec9" },
        { name: "LABARAC BAR", url: "https://www.appsheet.com/start/72365dd4-8292-4d7a-b3ba-3476fe546208" },
        { name: "MAJU JAYA RENTAL BALI", url: "https://www.appsheet.com/start/740ae273-d548-4d4c-ae34-e03dcc323f07" }
    ];

    const searchInput = document.getElementById('clientSearch');
    const autocompleteList = document.getElementById('autocomplete-list');
    const hiddenUrlInput = document.getElementById('selectedUrl');

    // 2. Fungsi membaca ketikan user
    searchInput.addEventListener('input', function() {
        const val = this.value.toUpperCase();
        autocompleteList.innerHTML = ''; 
        hiddenUrlInput.value = ''; // Reset URL jika user mengetik ulang

        // Syarat: Minimal ketik 2 huruf baru muncul
        if (val.length < 2) {
            autocompleteList.style.display = 'none';
            return;
        }

        // Filter data client yang namanya mengandung huruf yang diketik
        const filteredClients = clients.filter(client => 
            client.name.toUpperCase().includes(val)
        );

        // Jika ada hasil yang cocok, tampilkan di bawah input
        if (filteredClients.length > 0) {
            autocompleteList.style.display = 'block';
            
            filteredClients.forEach(client => {
                const li = document.createElement('li');
                li.className = 'list-group-item autocomplete-item';
                li.textContent = client.name;
                
                // Jika pilihan diklik, masukkan nama ke input dan simpan URL-nya
                li.onclick = function() {
                    searchInput.value = client.name;
                    hiddenUrlInput.value = client.url;
                    autocompleteList.style.display = 'none'; // Sembunyikan list setelah diklik
                };
                
                autocompleteList.appendChild(li);
            });
        } else {
            // Jika tidak ditemukan
            autocompleteList.style.display = 'block';
            const li = document.createElement('li');
            li.className = 'list-group-item text-muted';
            li.textContent = 'Client tidak ditemukan...';
            autocompleteList.appendChild(li);
        }
    });

    // 3. Menyembunyikan list jika user klik di luar kotak pencarian
    document.addEventListener('click', function(e) {
        if (e.target !== searchInput) {
            autocompleteList.style.display = 'none';
        }
    });

    // 4. Modifikasi fungsi enterSystem
    function enterSystem() {
        const targetUrl = hiddenUrlInput.value;

        if (!targetUrl) {
            alert("Silakan cari dan pilih nama client dari daftar terlebih dahulu!");
            // Mengarahkan kursor kembali ke kolom input
            searchInput.focus();
            return;
        }

        const finalUrl = targetUrl + "?platform=desktop&guiprof=true";
        window.location.href = finalUrl;
    }
</script>

</body>
</html>
