<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Katalog Armada - Zelly Rental</title>
    <link rel="stylesheet" href="stylezelly.css">
    <style>
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-top: 30px; }
        .card { background: white; border-radius: 15px; overflow: hidden; box-shadow: 0 5px 15px rgba(0,0,0,0.05); text-align: center; padding-bottom: 20px; }
        .card img { width: 100%; height: 200px; object-fit: cover; }
        .status { font-size: 12px; font-weight: 700; padding: 5px 15px; border-radius: 20px; display: inline-block; margin-bottom: 10px; }
        .available { background: #d4edda; color: #155724; }
    </style>
</head>
<body>
    <section class="container">
        <h2 class="title">Armada <span>Ready</span></h2>
        <div class="grid">
            <div class="card">
                <img src="https://images.unsplash.com/photo-1568772585407-9361f9bf3a87?w=400">
                <div style="padding: 20px;">
                    <span class="status available">Tersedia</span>
                    <h3>Yamaha NMAX New</h3>
                    <p>Rp 150.000 / Hari</p><br>
                    <a href="https://wa.me/6285187502977" class="btn-gold">Pesan Sekarang</a>
                </div>
            </div>
            </div>
    </section>
</body>
</html>
