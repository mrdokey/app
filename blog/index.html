        .card-blog { 
            border: none;

            transition: all 0.3s ease; 
            background: #fff;

        .card-blog:hover { 
            transform: translateY(-8px); 
            box-shadow: 0 15px 30px rgba(0,0,0,0.1); 
        }
        .badge-category { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; display: inline-block; }
